services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: datara
      POSTGRES_USER: datara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datara -d datara']
      interval: 5s
      retries: 10
volumes:
  postgres-data:
